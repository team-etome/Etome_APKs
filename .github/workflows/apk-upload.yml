name: Build and Upload APKs

on:
  push:
    branches:
      - main
    paths:
      - "*.apk"
      - "metadata.json"
      - "changelog.json"
      - "icons/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Prepare apps.json
        run: |
          set -euo pipefail
          echo "[]" > apps.json

          # loop through all APKs in repo
          for apk in *.apk; do
            base=$(basename "$apk" .apk)

            # split name and version (last dash separated field = version)
            pkg_name=$(echo "$base" | awk -F'-' '{NF--; print $0}' OFS="-")
            version=$(echo "$base" | awk -F'-' '{print $NF}')

            # timestamp suffix for uniqueness in S3
            timestamp=$(date +%Y%m%d%H%M%S)
            new_apk_name="${pkg_name}-${version}_v${timestamp}.apk"
            apk_s3_key="apks/${new_apk_name}"

            # upload apk to S3
            aws s3 cp "$apk" "s3://${{ secrets.S3_BUCKET_NAME }}/${apk_s3_key}"

            # construct apk_url
            apk_url="https://${{ secrets.S3_BUCKET_NAME }}.s3.${{ secrets.AWS_REGION }}.amazonaws.com/${apk_s3_key}"

            # read metadata and changelog
            changelog=$(jq -r --arg apk "$apk_name" '.[$apk] // empty' changelog.json)
            description=$(jq -r --arg pkg "$pkg_name" '.[$pkg].description // "No description provided."' metadata.json)
            app_name=$(jq -r --arg pkg "$pkg_name" '.[$pkg].name // $pkg' metadata.json)

            # icon (must exist in icons/ directory, uploaded to S3)
            icon_file="icons/${app_name}.png"
            if [ -f "$icon_file" ]; then
              aws s3 cp "$icon_file" "s3://${{ secrets.S3_BUCKET_NAME }}/icons/${app_name}.png"
            fi
            icon_url="https://${{ secrets.S3_BUCKET_NAME }}.s3.${{ secrets.AWS_REGION }}.amazonaws.com/icons/${app_name}.png"

            # new entry JSON
            entry=$(jq -n \
              --arg package_name "${pkg_name}-${version}" \
              --arg name "$app_name" \
              --arg version "$version" \
              --arg apk_url "$apk_url" \
              --arg changelog "$changelog" \
              --arg icon_url "$icon_url" \
              --arg description "$description" \
              '{
                package_name: $package_name,
                name: $name,
                version: $version,
                apk_url: $apk_url,
                changelog: $changelog,
                icon_url: $icon_url,
                description: $description
              }')

            # add to apps.json (temporary append list)
            tmp=$(mktemp)
            jq ". + [$entry]" apps.json > "$tmp" && mv "$tmp" apps.json
          done

          # ensure only latest version per package_name (by highest version)
          tmp=$(mktemp)
          jq -s '
            add
            | group_by(.name)
            | map(max_by(.version))
          ' apps.json > "$tmp" && mv "$tmp" apps.json

      - name: Upload apps.json to S3
        run: |
          aws s3 cp apps.json "s3://${{ secrets.S3_BUCKET_NAME }}/meta/apps.json" --content-type "application/json"
