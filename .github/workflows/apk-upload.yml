name: Upload New APKs to S3 and Update apps.json

on:
  push:
    paths:
      - '*.apk'
      - 'apk_mapping.json'
      - 'changelog.json'
      - 'metadata.json'
      - 'icons/**'

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Create temp folders
      run: mkdir -p meta_data

    - name: Download or create apps.json
      run: |
        aws s3 cp "s3://${{ secrets.S3_BUCKET_NAME }}/meta/apps.json" meta_data/apps.json || echo "[]" > meta_data/apps.json

    # IMPORTANT: prefer the repo metadata.json you commit; only fall back to S3; else {}
    - name: Load metadata.json (prefer repo copy)
      run: |
        if [ -f metadata.json ]; then
          echo "Using metadata.json from repo"
        elif aws s3 cp "s3://${{ secrets.S3_BUCKET_NAME }}/meta/metadata.json" metadata.json; then
          echo "Downloaded metadata.json from S3"
        else
          echo "{}" > metadata.json
          echo "No metadata.json found; created empty"
        fi
        cat metadata.json

    - name: Upload all icons to S3
      run: |
        if [ -d icons ]; then
          echo "Uploading icons to S3..."
          aws s3 cp icons/ "s3://${{ secrets.S3_BUCKET_NAME }}/icons/" --recursive
        else
          echo "No icons folder found, skipping."
        fi

    - name: Upload new APKs and update apps.json
      run: |
        set -euo pipefail

        # Find changed APKs in this push; if empty (e.g., manual rerun), fall back to all *.apk
        changed_apks=$(git diff --diff-filter=AM --name-only ${{ github.event.before }} ${{ github.sha }} -- '*.apk' || true)
        if [ -z "${changed_apks}" ]; then
          changed_apks=$(ls -1 *.apk 2>/dev/null || true)
        fi

        apps_file="meta_data/apps.json"
        metadata_file="metadata.json"

        # Always ensure apps_file exists
        [ -f "$apps_file" ] || echo "[]" > "$apps_file"

        for apk in $changed_apks; do
          [ -f "$apk" ] || continue

          # base without .apk
          raw_base=$(basename "$apk" .apk)
          # trim and remove any spaces (handles '...-0.1.0 .apk' and '0.2. 0.apk')
          clean_base=$(echo "$raw_base" | xargs | tr -d '[:space:]')

          # Key we use for metadata lookup
          meta_key="$clean_base"

          # Use timestamp as version
          version=$(date +%Y%m%d%H%M%S)
          new_apk_name="${clean_base}_v${version}.apk"
          apk_s3_key="apks/${new_apk_name}"
          apk_url="https://${{ secrets.S3_BUCKET_NAME }}.s3.${{ secrets.AWS_REGION }}.amazonaws.com/${apk_s3_key}"

          # Delete previous APK(s) for same clean_base (older versions)
          old_apk_keys=$(jq -r --arg base "$clean_base" '[.[] | select(.name | startswith($base + "_v")) | .apk_url] | .[]' "$apps_file" 2>/dev/null | sed -n 's|.*amazonaws.com/\(.*\)|\1|p' || true)
          for old_key in $old_apk_keys; do
            echo "Deleting old APK from S3: $old_key"
            aws s3 rm "s3://${{ secrets.S3_BUCKET_NAME }}/$old_key" || true
          done

          echo "Uploading new APK: $apk_s3_key"
          aws s3 cp "$apk" "s3://${{ secrets.S3_BUCKET_NAME }}/$apk_s3_key"

          # Get changelog, description, icon path
          changelog=$(jq -r --arg name "$meta_key" '.[$name] // "No changelog available."' changelog.json 2>/dev/null || echo "No changelog available.")
          description=$(jq -r --arg key "$meta_key" '.[$key].description // "No description."' "$metadata_file" 2>/dev/null || echo "No description.")
          icon_path=$(jq -r --arg key "$meta_key" '.[$key].icon // "icons/default.png"' "$metadata_file" 2>/dev/null || echo "icons/default.png")

          # Always build icon_url (never empty)
          icon_url="https://${{ secrets.S3_BUCKET_NAME }}.s3.${{ secrets.AWS_REGION }}.amazonaws.com/${icon_path}"

          # Remove old entries of same app from apps.json and add the new one
          updated_apps=$(jq --arg base "$clean_base" '[.[] | select(.name | startswith($base + "_v") | not)]' "$apps_file")

          new_entry=$(jq -n \
            --arg name "${clean_base}_v${version}" \
            --arg version "$version" \
            --arg apk_url "$apk_url" \
            --arg changelog "$changelog" \
            --arg icon_url "$icon_url" \
            --arg description "$description" \
            '{name: $name, version: $version, apk_url: $apk_url, changelog: $changelog, icon_url: $icon_url, description: $description}')

          echo "$updated_apps" | jq --argjson new "$new_entry" '. + [$new]' > "$apps_file"
        done

        echo "Final apps.json:"
        cat "$apps_file"

        aws s3 cp "$apps_file" "s3://${{ secrets.S3_BUCKET_NAME }}/meta/apps.json"
