name: Build and Publish APKs

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload new APKs and update apps.json
        run: |
          set -euo pipefail

          mkdir -p tmp
          apps_file="tmp/apps.json"

          # Download current apps.json from S3 if exists
          if aws s3 cp "s3://${{ secrets.S3_BUCKET_NAME }}/meta/apps.json" "$apps_file"; then
            echo "Downloaded existing apps.json"
          else
            echo "[]" > "$apps_file"
          fi

          changed_apks=$(find build/app/outputs/flutter-apk -name "*.apk")

          for apk in $changed_apks; do
            [ -f "$apk" ] || continue

            raw_base=$(basename "$apk" .apk)
            temp_base=$(echo "$raw_base" | xargs | tr -d '[:space:]')
            clean_base=$(echo "$temp_base" | sed -E 's/_v[0-9]+$//')

            # Extract version from base name (last part after dash)
            version=$(echo "$clean_base" | awk -F'-' '{print $NF}')

            # Generate unique name with timestamp
            timestamp=$(date +%Y%m%d%H%M%S)
            new_apk_name="${clean_base}_v${timestamp}.apk"
            apk_s3_key="apks/${new_apk_name}"
            apk_url="https://${{ secrets.S3_BUCKET_NAME }}.s3.${{ secrets.AWS_REGION }}.amazonaws.com/${apk_s3_key}"

            # Upload APK to S3
            aws s3 cp "$apk" "s3://${{ secrets.S3_BUCKET_NAME }}/${apk_s3_key}" --acl public-read

            package_base=$(echo "$clean_base" | cut -d'-' -f1)
            icon_url="https://${{ secrets.S3_BUCKET_NAME }}.s3.${{ secrets.AWS_REGION }}.amazonaws.com/icons/${package_base}.png"
            changelog="Minor UI improvements"
            description="$(echo "$package_base" | awk -F. '{print $NF}') $version - Task manager"

            # Remove old entries for same package
            updated_apps=$(jq --arg base "$package_base" '[.[] | select(.package_name and (.package_name | startswith($base) | not))]' "$apps_file")

            # Add new entry
            updated_apps=$(echo "$updated_apps" | jq \
              --arg package_name "$clean_base" \
              --arg name "Etome Todo" \
              --arg version "$version" \
              --arg apk_url "$apk_url" \
              --arg changelog "$changelog" \
              --arg icon_url "$icon_url" \
              --arg description "$description" \
              '. + [{
                package_name: $package_name,
                name: $name,
                version: $version,
                apk_url: $apk_url,
                changelog: $changelog,
                icon_url: $icon_url,
                description: $description
              }]')

            echo "$updated_apps" > "$apps_file"
          done

          # Upload updated apps.json back to S3
          aws s3 cp "$apps_file" "s3://${{ secrets.S3_BUCKET_NAME }}/meta/apps.json" --acl public-read
