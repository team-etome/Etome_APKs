name: Upload New APKs to S3 and Update apps.json

on:
  push:
    paths:
      - '*.apk'
      - 'apk_mapping.json'
      - 'changelog.json'
      - 'metadata.json'
      - 'icons/**'

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Exit if only deleted files are in the commit
      run: |
        BEFORE_SHA=${{ github.event.before }}
        CURRENT_SHA=${{ github.sha }}
        deleted_files=$(git diff --diff-filter=D --name-only "$BEFORE_SHA" "$CURRENT_SHA" | grep -E '\.apk$|apk_mapping\.json|changelog\.json|metadata\.json|icons/' || true)
        all_changed_files=$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" | grep -E '\.apk$|apk_mapping\.json|changelog\.json|metadata\.json|icons/' || true)
        if [ "$deleted_files" = "$all_changed_files" ] && [ -n "$deleted_files" ]; then
          echo "All matching files were deleted. Skipping upload."
          exit 0
        fi

    - name: Create temp folders
      run: mkdir -p meta_data

    - name: Download or create apps.json
      run: |
        aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/meta/apps.json meta_data/apps.json || echo "[]" > meta_data/apps.json

    - name: Download metadata.json from S3
      run: |
        aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/meta/metadata.json metadata.json || echo "{}" > metadata.json

    - name: Upload all icons to S3
      run: |
        if [ -d icons ]; then
          echo "Uploading all icons to S3..."
          aws s3 cp icons/ "s3://${{ secrets.S3_BUCKET_NAME }}/icons/" --recursive
        else
          echo "No icons folder found, skipping."
        fi

    - name: Upload new APKs and update apps.json
      run: |
        changed_apks=$(git diff --diff-filter=AM --name-only ${{ github.event.before }} ${{ github.sha }} -- '*.apk')
        metadata_file="metadata.json"

        for apk in $changed_apks; do
          [ -f "$apk" ] || continue
          base_name=$(basename "$apk" .apk)

          # Count existing versions before deleting
          existing_count=$(jq '[.[] | select(.name | test("'"$base_name"'_v[0-9]+$"))] | length' meta_data/apps.json)
          version=$((existing_count + 1))
          new_apk_name="${base_name}_v${version}.apk"
          apk_s3_key="apks/${new_apk_name}"
          apk_url="https://${{ secrets.S3_BUCKET_NAME }}.s3.${{ secrets.AWS_REGION }}.amazonaws.com/${apk_s3_key}"

          meta_key="$base_name"

          # Delete only the latest old APK if exists
          old_apk_key=$(jq -r --arg base "$base_name" \
            '[.[] | select(.name | test($base + "_v[0-9]+$"))] | last | .apk_url' meta_data/apps.json \
            | sed -n 's|.*amazonaws.com/\(.*\)|\1|p')
          if [ -n "$old_apk_key" ]; then
            echo "Deleting old APK from S3: $old_apk_key"
            aws s3 rm "s3://${{ secrets.S3_BUCKET_NAME }}/$old_apk_key" || true
          fi

          # Upload new APK
          echo "Uploading new APK to S3: $apk_s3_key"
          aws s3 cp "$apk" "s3://${{ secrets.S3_BUCKET_NAME }}/$apk_s3_key"

          # Get changelog
          changelog=$(jq -r --arg name "$meta_key" '.[$name] // "No changelog available."' changelog.json 2>/dev/null || echo "No changelog available.")

          # Get description & icon
          description=$(jq -r --arg key "$meta_key" '.[$key].description // "No description."' "$metadata_file")
          icon_path=$(jq -r --arg key "$meta_key" '.[$key].icon // ""' "$metadata_file")
          icon_url=""
          if [ -n "$icon_path" ] && [ "$icon_path" != "null" ]; then
            icon_url="https://${{ secrets.S3_BUCKET_NAME }}.s3.${{ secrets.AWS_REGION }}.amazonaws.com/$icon_path"
          fi

          # Remove old entries if needed
          updated_apps=$(jq --arg base "$base_name" 'map(select(.name | startswith($base + "_v") | not))' meta_data/apps.json)

          # Create new entry
          new_entry=$(jq -n \
            --arg name "${base_name}_v${version}" \
            --arg version "v${version}" \
            --arg apk_url "$apk_url" \
            --arg changelog "$changelog" \
            --arg icon_url "$icon_url" \
            --arg description "$description" \
            '{name: $name, version: $version, apk_url: $apk_url, changelog: $changelog, icon_url: $icon_url, description: $description}')

          echo "$updated_apps" | jq --argjson new "$new_entry" '. + [$new]' > meta_data/apps.json
        done

        echo "Final apps.json:"
        cat meta_data/apps.json

        aws s3 cp meta_data/apps.json s3://${{ secrets.S3_BUCKET_NAME }}/meta/apps.json
